[project]
name = "examtopics-helper"
dynamic = ["version"]
description = "Extract and export ExamTopics exam questions to HTML, PDF, and Markdown"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "rich>=14.3.1",
    "selectolax>=0.4.6",
    "typer>=0.21.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=68.0"]
watch = [
    "watchfiles>=1.1.1",
]

[project.scripts]
examtopics = "examtopics.cli:cli"

[tool.uv]
package = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
    "ruff>=0.14.14",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/examtopics/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/examtopics"]
